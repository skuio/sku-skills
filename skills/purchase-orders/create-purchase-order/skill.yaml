name: create-purchase-order
title: Create a Purchase Order
domain: purchase-orders
version: 1.2.0
description: >-
  Create a purchase order with a supplier from a plain description or a source document (supplier
  email, order form, demand-plan export): resolve supplier, warehouse, costs and lines, and create
  it as a draft or open order. Use to reorder stock, including consignment replenishment.
tagline: Create a replenishment PO for a supplier from a description or document
tags: [purchase-orders, purchasing, replenishment, consignment, supplier, create]
maintainers: [kmizzi]
composes: [build-product-catalog, find-product]
pages:
  - /orders/purchase-orders
icon: mdi-clipboard-plus-outline
auth:
  scopes: [purchase-orders:write, suppliers:read, warehouses:read, products:read, settings:read]
api:
  base_url: https://{tenant}.sku.io
  operations:
    - id: find-supplier
      method: GET
      path: /api/v2/suppliers
      summary: Find a supplier by name/email to get its id (and its default warehouse and payment term).
      parameters:
        - name: search
          in: query
          type: string
          required: false
          description: Search by supplier name, email, or company name. Narrow to a single match before using the id.
          example: Wizenburg
        - name: limit
          in: query
          type: integer
          required: false
          description: Items per page (default 10).
    - id: list-warehouses
      method: GET
      path: /api/v2/warehouses
      summary: List warehouses (id, name, code, is_default) to resolve the destination warehouse.
    - id: list-payment-terms
      method: GET
      path: /api/payment-terms
      summary: >-
        List payment terms to resolve payment_term_id. Each term carries an is_consignment boolean
        (and consignment_settlement_frequency), so the consignment term is identified by that flag
        rather than by name-guessing. Paginated; there is no search param — page through and match
        on the returned fields (id, name, is_consignment, is_default, net_days).
      parameters:
        - name: page
          in: query
          type: integer
          required: false
          description: Page number — the list is paginated; iterate if there are more terms than one page.
    - id: list-currencies
      method: GET
      path: /api/currencies
      summary: >-
        List the account's enabled currencies (id, code, conversion rate, is_default) to resolve or
        verify currency_code / currency_id.
    - id: get-last-purchase-price
      method: GET
      path: /api/products/{product}/last-purchase-price
      summary: Most recent unit cost paid for a product on a non-draft PO — fills a line's amount when the source has no cost.
      parameters:
        - name: product
          in: path
          type: integer
          required: true
          description: Product id (from find-product).
    - id: create-purchase-order
      method: POST
      path: /api/purchase-orders
      summary: Create a purchase order with header fields and an array of line items.
      parameters:
        - name: purchase_order_date
          in: body
          type: string
          required: true
          description: PO date (ISO-8601, account timezone).
          example: "2026-07-10"
        - name: supplier_id
          in: body
          type: integer
          required: false
          description: >-
            The supplier being ordered from (from find-supplier). Required unless you pass
            supplier_name instead.
        - name: supplier_name
          in: body
          type: string
          required: false
          description: >-
            Supplier name, as an alternative to supplier_id. Prefer resolving supplier_id first;
            an exact name the API doesn't match will 422.
        - name: currency_code
          in: body
          type: string
          required: false
          description: >-
            ISO currency code for the PO (e.g. "USD", "AUD"). Required unless you pass currency_id.
            Use the account/supplier base currency; resolve or verify it with list-currencies.
          example: USD
        - name: currency_id
          in: body
          type: integer
          required: false
          description: Currency id, as an alternative to currency_code.
        - name: destination_warehouse_id
          in: body
          type: integer
          required: false
          description: >-
            Warehouse the stock is received into (from list-warehouses). Required for a standard PO;
            omit only for a dropship PO that ships straight to the customer. For a consignment order,
            this is the consignment (supplier-owned) warehouse.
        - name: payment_term_id
          in: body
          type: integer
          required: false
          description: >-
            Payment term for the PO — e.g. the account's consignment term. Optional. Resolve the id
            with list-payment-terms: for a consignment order pick the term whose is_consignment is
            true; otherwise match by name or fall back to the supplier's default_payment_term_id.
            Don't invent it. See INSTRUCTIONS.md.
        - name: order_status
          in: body
          type: string
          required: false
          description: >-
            The only accepted value is "draft" (creates a draft PO). Omit the field entirely to
            create an open PO.
          example: draft
        - name: approval_status
          in: body
          type: string
          required: false
          description: '"pending" (default) or "approved".'
          example: pending
        - name: estimated_delivery_date
          in: body
          type: string
          required: false
          description: Expected arrival date (ISO-8601).
          example: "2026-08-01"
        - name: purchase_order_number
          in: body
          type: string
          required: false
          description: Custom PO number. Auto-generated if omitted.
        - name: supplier_notes
          in: body
          type: string
          required: false
          description: Notes to the supplier, printed on the PO.
        - name: submission_format
          in: body
          type: string
          required: false
          description: How the PO is sent to the supplier when submitted (e.g. "email").
        - name: store_id
          in: body
          type: integer
          required: false
          description: Store/sales-channel the PO is attributed to.
        - name: tags
          in: body
          type: array
          required: false
          description: Array of string tags for filtering/reporting.
        - name: purchase_order_lines
          in: body
          type: array
          required: false
          description: >-
            Array of line items. Each line: { product_id OR sku (required unless a pure cost line),
            quantity (required, >= 0), amount (required unit cost, >= 0), description (recommended),
            discount, tax_rate_id, estimated_delivery_date, is_free_of_charge all optional }.
        - name: financial_lines
          in: body
          type: array
          required: false
          description: >-
            Optional non-product charges (freight, duties). Each: { description, quantity, amount,
            financial_line_type_id, allocate_to_products, proration_strategy }.
    - id: submit-purchase-order
      method: POST
      path: /api/purchase-orders/submit
      summary: Submit (send to the supplier) one or more created POs. Sends the PO out — confirm first.
      parameters:
        - name: ids
          in: body
          type: array
          required: true
          description: Array of purchase-order ids to submit to their suppliers.
          example: [102]
    - id: submit-one-purchase-order
      method: PUT
      path: /api/purchase-orders/{purchase_order}/submit
      summary: Submit one PO to its supplier. A draft is approved and opened first (approval policies apply); bulk submit only takes open POs.
      parameters:
        - name: purchase_order
          in: path
          type: integer
          required: true
          description: The purchase order id.
          example: 102
        - name: supplier_message
          in: body
          type: string
          required: false
          description: Optional note to the supplier, printed on the PO. Replaces the PO's supplier notes.
        - name: notify_supplier
          in: body
          type: boolean
          required: false
          description: false marks the PO submitted without emailing the supplier (for suppliers with no PO email). Defaults to true.

# How the SKU.io MCP server exposes this skill (dist/mcp/manifest.json). See SKILL_SPEC.md.
mcp:
  prompt: true
  tools:
    - tool: create_purchase_order
      operation: create-purchase-order
      title: Create a draft purchase order
      description: >-
        Creates a draft purchase order with its supplier, receiving warehouse, lines and charges.
        Nothing is sent to the supplier. Returns the PO id, number and sku_url.
      scope: purchase-orders:write
      exclude_params: [order_status, approval_status, submission_format, store_id, tags]
      params:
        purchase_order_date: ISO date.
        supplier_name: ""
        currency_code: ISO currency code, e.g. USD.
        currency_id: ""
        payment_term_id: ""
        estimated_delivery_date: ISO date.
        purchase_order_number: ""
        supplier_notes: ""
        supplier_id: The supplier id. Alternatively give supplier_name.
        destination_warehouse_id: Receiving warehouse id; omit only for a dropship PO.
        purchase_order_lines: "Lines: [{product_id or sku, quantity, amount (unit cost), description}]."
        financial_lines: "Charges: [{description, quantity, amount, financial_line_type_id}]."
      annotations: { read_only: false, destructive: true, idempotent: false, open_world: false }
    - tool: submit_purchase_order
      operation: submit-one-purchase-order
      title: Submit a purchase order to its supplier
      description: >-
        Submits one purchase order to its supplier (e.g. by email), approving and opening a draft
        first. This sends documents to a third party and cannot be recalled.
      scope: purchase-orders:write
      params:
        purchase_order: The purchase order id.
        supplier_message: Note printed on the PO.
        notify_supplier: false skips the supplier email.
      annotations: { read_only: false, destructive: true, idempotent: false, open_world: true }

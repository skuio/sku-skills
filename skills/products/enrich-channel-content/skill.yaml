name: enrich-channel-content
title: Enrich Product Content for a Sales Channel
domain: products
version: 1.0.0
description: >-
  Fill in the channel-specific product content a marketplace needs before you can list there —
  today, a per-channel description attribute such as tiktokshop_description — supplier by
  supplier or brand by brand. For each product it gathers what already exists (the live Amazon
  or eBay copy, the product's own attributes), asks SKU.io's AI to amalgamate it into copy that
  follows the target channel's own rules, and renders an HTML review report — product image,
  every source side by side, the proposal, and the AI's rationale — with approve/reject per
  product. Only approved descriptions are written back. When no copy exists anywhere it falls
  back to the manufacturer's site, and finally to a drafted email asking the supplier. Use it
  whenever "we can't list these on TikTok Shop / Walmart / Temu because the descriptions are
  missing" — or whenever a channel's content rules differ enough that reusing another channel's
  description would be wrong.
tagline: Amalgamate existing copy into channel-correct descriptions, reviewed before it lands
tags: [products, pim, attributes, enrichment, description, tiktok, amazon, ebay, ai, content]
maintainers: [kmizzi]
composes: [find-product]
pages:
  - /listings/profiles
  - /listings/templates
  - /products
auth:
  scopes: [products:read, products:write, suppliers:read]
api:
  base_url: https://{tenant}.sku.io
  operations:
    - id: list-products-by-brand
      method: GET
      path: /api/v2/products
      summary: >-
        Paginated products. Filter by brand NAME to scope an enrichment run to one supplier's
        catalogue; parent_id and type tell you which rows are matrix children.
      parameters:
        - name: filter[brand]
          in: query
          type: string
          required: false
          description: Exact brand name, e.g. "Charlie Banana". Accepts an array for several brands.
          example: Charlie Banana
        - name: filter[search]
          in: query
          type: string
          required: false
          description: Free-text search over SKU / name / barcode / MPN / brand.
        - name: per_page
          in: query
          type: integer
          required: false
          description: Page size (max 100).
          example: 100
        - name: page
          in: query
          type: integer
          required: false
          description: Page number.
          example: 1

    - id: get-product
      method: GET
      path: /api/v2/products/{product}
      summary: >-
        One product in full — name, sku, brand, image / image_url / other_images, parent_id, type,
        matrix_product, variations, attributes, default_supplier. The image is what the review
        report shows so the reviewer knows what they are approving.
      parameters:
        - name: product
          in: path
          type: integer
          required: true
          description: The SKU.io product id.

    - id: get-product-listings
      method: GET
      path: /api/v2/products/{product}/listings
      summary: >-
        The product's live listings across every channel. Each row carries sales_channel,
        integration.name, integration_instance_id and document_id — the channel-product id you
        need to fetch the channel's own copy for this product.
      parameters:
        - name: product
          in: path
          type: integer
          required: true
          description: The SKU.io product id.

    - id: get-amazon-channel-product
      method: GET
      path: /api/amazon/{integrationInstance}/products/{product}
      summary: >-
        An Amazon channel product with its catalog data. Ask for catalog_data explicitly — it
        carries attributes.product_description[].value, attributes.bullet_point[].value and
        attributes.item_name[].value, the copy Amazon actually shows.
      parameters:
        - name: integrationInstance
          in: path
          type: integer
          required: true
          description: The Amazon integration instance id (integration_instance_id on the listing row).
        - name: product
          in: path
          type: integer
          required: true
          description: The Amazon channel-product id (document_id on the listing row).
        - name: included
          in: query
          type: string
          required: true
          description: JSON array of extra fields to include. Pass ["catalog_data"].
          example: '["catalog_data"]'

    - id: get-ebay-channel-product-raw
      method: GET
      path: /api/ebay/{integrationInstance}/products/{product}/raw
      summary: >-
        The live eBay item straight from eBay (GetItem), including its Description HTML — the
        stored channel product does not carry it, so this is the only way to read eBay copy.
      parameters:
        - name: integrationInstance
          in: path
          type: integer
          required: true
          description: The eBay integration instance id.
        - name: product
          in: path
          type: integer
          required: true
          description: The eBay channel-product id (document_id on the listing row).

    - id: get-product-attributes
      method: GET
      path: /api/products/{productId}/attributes
      summary: >-
        The product's attribute values, including any description already written for another
        channel (amazon_description, ebay_description) and the target channel attribute if it
        has been filled before.
      parameters:
        - name: productId
          in: path
          type: integer
          required: true
          description: The SKU.io product id.

    - id: list-attributes
      method: GET
      path: /api/v2/attributes
      summary: The attribute catalogue — check whether the channel's description attribute exists before creating it.
      parameters:
        - name: filter[search]
          in: query
          type: string
          required: false
          description: Search by attribute name.
          example: tiktokshop_description

    - id: create-attribute
      method: POST
      path: /api/attributes
      summary: >-
        Create the channel-specific description attribute. Use type longtext; set
        display_options.is_html when the channel renders HTML so the PIM opens a rich-text editor.
      parameters:
        - name: name
          in: body
          type: string
          required: true
          description: Follow the existing convention {channel}_description, e.g. tiktokshop_description.
          example: tiktokshop_description
        - name: type
          in: body
          type: string
          required: true
          description: Always longtext for a description.
          example: longtext
        - name: display_options
          in: body
          type: object
          required: false
          description: '{"is_html": true} when the channel renders HTML (TikTok Shop, eBay, Shopify); omit for plain-text channels (Amazon, Walmart).'
        - name: notes
          in: body
          type: string
          required: false
          description: Where the value is used, e.g. "Mapped to TikTok Shop → Description on the channel profile."

    - id: generate-listing-content
      method: POST
      path: /api/ai/listing-content
      summary: >-
        Ask SKU.io's AI for channel-correct content. Pass everything you gathered as
        source_material; the model amalgamates it under the target channel's own description
        rules (format, length, structure) and returns a rationale explaining what it used.
        Returned for review only — nothing is written.
      parameters:
        - name: product_id
          in: body
          type: integer
          required: true
          description: The SKU.io product id.
        - name: sales_channel_id
          in: body
          type: integer
          required: true
          description: The TARGET sales channel — the one the description is for.
        - name: fields
          in: body
          type: array
          required: false
          description: 'Which pieces to generate. For enrichment use ["description"].'
          example: '["description"]'
        - name: source_material
          in: body
          type: array
          required: false
          description: >-
            Up to 10 entries of {label, text} — existing copy from other channels, the
            manufacturer's page, a supplier sheet. Label each with its origin so the rationale can
            name it. Each text up to 8000 characters.
        - name: description_format
          in: body
          type: string
          required: false
          description: '"html" or "plain". Omit to use the channel''s own rule (TikTok Shop html, Amazon plain, ...).'
        - name: description_max_length
          in: body
          type: integer
          required: false
          description: Override the channel's length cap (100-20000). Omit to use the channel's own.
        - name: include_product_attributes
          in: body
          type: boolean
          required: false
          description: Feed the product's own attributes as facts (default true).
        - name: tone
          in: body
          type: string
          required: false
          description: e.g. professional, friendly, playful.
          example: professional
        - name: target_keywords
          in: body
          type: array
          required: false
          description: Up to 25 keywords to weave in where truthful.
        - name: additional_instructions
          in: body
          type: string
          required: false
          description: Free-text steering, up to 500 characters.

    - id: set-product-attributes
      method: PUT
      path: /api/products/{productId}/attributes
      summary: >-
        Write attribute values on a product. Only ever call this with descriptions the reviewer
        approved. Send the attribute by name; other attributes are left untouched.
      parameters:
        - name: productId
          in: path
          type: integer
          required: true
          description: The SKU.io product id.
        - name: attributes
          in: body
          type: array
          required: true
          description: 'Array of {name, value} (or {id, value}). e.g. [{"name":"tiktokshop_description","value":"<p>…</p>"}]'

    - id: get-supplier
      method: GET
      path: /api/v2/suppliers/{supplier}
      summary: >-
        The supplier record — email, purchase_order_email, primary_contact_name, website. Used to
        address the enrichment request when no copy exists anywhere.
      parameters:
        - name: supplier
          in: path
          type: integer
          required: true
          description: The supplier id (default_supplier.id on the product).

    - id: sync-listing-profile-mappings
      method: PUT
      path: /api/v2/sales-channels/{salesChannel}/listing-profiles/{profile}/mappings
      summary: >-
        Point the channel profile's Description at the new attribute so every listing on that
        channel reads it. Full replace — send the profile's complete mapping set.
      parameters:
        - name: salesChannel
          in: path
          type: integer
          required: true
          description: The target sales channel id.
        - name: profile
          in: path
          type: integer
          required: true
          description: The listing profile id.
        - name: mappings
          in: body
          type: array
          required: true
          description: 'Complete set of {channel_field_name, source_type, source_value}. For the description: {"channel_field_name":"Description","source_type":"product_attribute","source_value":"<attribute id>"}'

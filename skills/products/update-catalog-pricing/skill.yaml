name: update-catalog-pricing
title: Update Catalog Pricing from a Price File
domain: products
version: 1.0.0
description: >-
  Apply a new price file to products that already exist in SKU.io — a supplier's updated
  wholesale/cost list, a new MSRP sheet, or any repriced list. Match each row to an existing
  product (SKU, supplier SKU, MPN, or barcode), diff old vs new prices, get the user's
  confirmation, then update supplier pricing tiers (what you pay) and/or product pricing tiers
  (what you charge). Use this when a supplier sends "new pricing effective <date>" or the
  business reprices a range; it never creates products (that is build-product-catalog).
tagline: Apply a supplier's new price file to the existing catalog
tags: [products, pricing, price-file, supplier, wholesale, cost, repricing, update]
maintainers: [kmizzi]
composes: [find-product, create-saved-view]
pages:
  - /products
auth:
  scopes: [products:read, products:write, suppliers:read]
api:
  base_url: https://{tenant}.sku.io
  operations:
    - id: find-supplier
      method: GET
      path: /api/v2/suppliers
      summary: Resolve the supplier named on the price file to its supplier id.
      parameters:
        - name: search
          in: query
          type: string
          required: false
          description: Free-text search over supplier name/company/email.
          example: VE Petersen
    - id: list-products
      method: GET
      path: /api/v2/products
      summary: >-
        Bulk-fetch the current catalog for matching and diffing. Rows include sku, mpn, barcode,
        default_supplier_id, default_supplier_sku, default_supplier_price, unit_cost, and type.
      parameters:
        - name: per_page
          in: query
          type: integer
          required: false
          description: Page size (default 10; use 500 for a bulk pull).
          example: 500
        - name: page
          in: query
          type: integer
          required: false
          description: Page number; iterate until last_page.
          example: 1
        - name: filter[default_supplier_id]
          in: query
          type: string
          required: false
          description: Limit to products whose default supplier matches (comma-separated ids).
          example: "1"
        - name: filter[search]
          in: query
          type: string
          required: false
          description: Full-text search across id, SKU, name, barcode, MPN, brand.
    - id: get-product-by-sku
      method: GET
      path: /api/products/by-sku
      summary: Targeted existence check for a single row when a bulk pull is overkill.
      parameters:
        - name: sku
          in: query
          type: string
          required: true
          description: The exact SKU to look up.
          example: GSL392
    - id: get-product-suppliers
      method: GET
      path: /api/products/{productId}/suppliers
      summary: >-
        Read a product's supplier links, including each link's supplier pricing tiers — this is
        where the account's actual tier name (e.g. "Wholesale") and current price come from.
      parameters:
        - name: productId
          in: path
          type: integer
          required: true
          description: The product id.
          example: 45
    - id: update-product-pricing
      method: PUT
      path: /api/products/{id}
      summary: >-
        Write the new prices. Cost side goes in suppliers[].pricing[] (tier name + price, with
        operation "updateOrCreate" on EVERY entry so omitted suppliers are not unlinked); sell
        side goes in pricing[] (product_pricing_tier_name + price). All fields optional.
      parameters:
        - name: id
          in: path
          type: integer
          required: true
          description: The product id to update.
          example: 45
        - name: pricing
          in: body
          type: array
          required: false
          description: >-
            Sell-price tiers, each { product_pricing_tier_name, price }. Only send when the task
            includes updating what you charge; a supplier cost file alone should not touch these.
        - name: suppliers
          in: body
          type: array
          required: false
          description: >-
            Supplier links, each { supplier_id, operation, pricing: [{ supplier_pricing_tier_name,
            price }] }. Set operation "updateOrCreate" on every entry — when any entry omits
            operation the array is treated as the complete list and absent suppliers are UNLINKED.
            Tier price is required, numeric, >= 0 and < 100000; price null returns 422.

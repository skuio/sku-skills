name: record-vendor-credit
title: Record a Vendor Credit
domain: accounting
version: 1.0.0
description: >-
  Record a supplier's credit memo (vendor credit, credit note) in SKU.io from the memo document —
  a PDF or email from the supplier — then apply it to the supplier bill(s) it should reduce.
  Built for non-inventory credits: co-op or advertising credits, marketing allowances, rebates
  paid as account credit, overbilling and other "only what we owe changes" credits. Checks for a
  duplicate by credit number, follows how the account recorded earlier credits from the same
  supplier (date, expense account, wording), creates the credit as a draft, previews its
  accounting impact, authorizes it, allocates it to an open purchase invoice, attaches the source
  document, and prints direct links. Returned or damaged goods and price corrections against a
  PO line are flagged and routed rather than forced into a financial-only credit.
tagline: Record a supplier credit memo and apply it to an open bill
tags: [vendor-credits, credit-memo, credit-note, accounts-payable, supplier, advertising, allocation, record]
maintainers: [kmizzi]
composes: [record-purchase-invoice]
pages:
  - /purchases/vendor-credits
  - /orders/purchase-invoices
auth:
  scopes: [accounting:read, accounting:write, purchase-orders:read, suppliers:read, settings:read]
api:
  base_url: https://{tenant}.sku.io
  operations:
    - id: find-supplier
      method: GET
      path: /api/v2/suppliers
      summary: Resolve the supplier named on the memo to its id. (A bare GET /api/suppliers 405s.)
      parameters:
        - name: filter[search]
          in: query
          type: string
          required: false
          description: Supplier name or email from the memo.
          example: Acme Batteries
    - id: list-vendor-credits
      method: GET
      path: /api/vendor-credits
      summary: >-
        List vendor credits. Used twice — the duplicate check (by the supplier's credit memo
        number) and to read how earlier credits from the same supplier were recorded, so the new
        one matches them.
      parameters:
        - name: filter[vendor_credit_number]
          in: query
          type: string
          required: false
          description: The supplier's credit memo number, exactly as printed. The duplicate check.
          example: "0002411"
        - name: filter[search]
          in: query
          type: string
          required: false
          description: Free-text over credit number, supplier name and references.
        - name: filter[supplier_id]
          in: query
          type: string
          required: false
          description: Narrow to one supplier's credits (precedent lookup).
    - id: get-vendor-credit
      method: GET
      path: /api/vendor-credits/{vendor_credit}
      summary: >-
        Full credit with lines (each line's nominal_code_id / nominal_code, cost_impact,
        description), allocations, totals, remaining_amount and credit_status.
      parameters:
        - name: vendor_credit
          in: path
          type: integer
          required: true
          description: Vendor credit id.
    - id: list-credit-reasons
      method: GET
      path: /api/vendor-credits/credit-reasons
      summary: >-
        The credit reasons (goods_returned, goods_damaged, price_correction, volume_rebate,
        short_shipped, overpayment, marketing_allowance, services_provided, other), each with its
        consequence and default cost impact.
    - id: find-nominal-code
      method: GET
      path: /api/v2/nominal-codes
      summary: >-
        Resolve the expense / income account the credit posts against (e.g. "Advertising") to its
        id. Prefer the account earlier credits from the same supplier used.
      parameters:
        - name: filter[search]
          in: query
          type: string
          required: false
          description: Account name or code.
          example: Advertising
    - id: create-vendor-credit
      method: POST
      path: /api/vendor-credits
      summary: >-
        Create the credit. Send credit_status "draft" — omitting it creates the credit already
        OPEN, which posts its accounting immediately and skips the impact preview.
      parameters:
        - name: supplier_id
          in: body
          type: integer
          required: true
          description: Supplier id (from find-supplier).
        - name: credit_status
          in: body
          type: string
          required: false
          description: 'draft | open | closed | void. Use "draft"; the model default is open.'
          example: draft
        - name: vendor_credit_number
          in: body
          type: string
          required: false
          description: >-
            The supplier's credit memo number, exactly as printed. Unique across the account — a
            422 "already used" means the memo is already recorded.
          example: "0002411"
        - name: credit_date
          in: body
          type: string
          required: false
          description: ISO date. See the instructions on memo date vs. service-period date.
          example: "2026-07-31"
        - name: credit_reason
          in: body
          type: string
          required: false
          description: A value from list-credit-reasons; it sets each line's default cost_impact.
          example: marketing_allowance
        - name: supplier_reference
          in: body
          type: string
          required: false
          description: Any other reference printed on the memo (the bill or invoice it answers).
        - name: currency_code
          in: body
          type: string
          required: false
          description: Omit for the account currency. Must match any bill it will be allocated to.
        - name: vendor_credit_note
          in: body
          type: string
          required: false
          description: Free-text note — what the credit is for and what document it answers.
        - name: lines
          in: body
          type: array
          required: false
          description: >-
            Each: { description, quantity (min 1), amount (unit amount, positive), nominal_code_id,
            is_product: false, cost_impact: "financial_only" }. A line needs description,
            purchase_order_line_id or financial_line_id.
    - id: preview-cost-impact
      method: GET
      path: /api/vendor-credits/{vendor_credit}/cost-impact
      summary: >-
        Read-only preview of what authorizing will do: accounts_payable_change, stock and cost
        basis changes, and touches_closed_period. A financial-only credit should show only an A/P
        change.
      parameters:
        - name: vendor_credit
          in: path
          type: integer
          required: true
          description: Vendor credit id.
    - id: authorize-vendor-credit
      method: POST
      path: /api/vendor-credits/{vendor_credit}/authorize
      summary: Move the draft to open and post its accounting. Reversible with /unauthorize while unallocated.
      parameters:
        - name: vendor_credit
          in: path
          type: integer
          required: true
          description: Vendor credit id.
    - id: list-open-bills
      method: GET
      path: /api/purchase-invoices
      summary: >-
        The supplier's bills that still have a balance to apply the credit to. Each row carries
        outstanding_balance, applied_vendor_credits_total, status and purchase_invoice_date.
      parameters:
        - name: filter[supplier_id]
          in: query
          type: string
          required: false
          description: Supplier id. Always send it — without it the list spans every supplier.
        - name: filter[status]
          in: query
          type: string
          required: false
          description: Comma list — use unpaid,partially_paid.
          example: unpaid,partially_paid
        - name: sort
          in: query
          type: string
          required: false
          description: purchase_invoice_date for oldest first.
          example: purchase_invoice_date
        - name: limit
          in: query
          type: integer
          required: false
          description: Page size.
    - id: allocate-vendor-credit
      method: POST
      path: /api/vendor-credits/{vendor_credit}/allocate
      summary: >-
        Apply some or all of an open credit to one bill. Same supplier and currency only; amount
        may not exceed the credit's remaining balance or the bill's outstanding balance. A fully
        allocated credit closes itself.
      parameters:
        - name: vendor_credit
          in: path
          type: integer
          required: true
          description: Vendor credit id.
        - name: purchase_invoice_id
          in: body
          type: integer
          required: true
          description: The bill's id (from list-open-bills) — not its supplier invoice number.
        - name: amount
          in: body
          type: number
          required: true
          description: Amount to apply (min 0.01).
        - name: allocated_at
          in: body
          type: string
          required: false
          description: Optional ISO date; defaults to now.
        - name: notes
          in: body
          type: string
          required: false
          description: Why this bill (max 1000 chars).
    - id: attach-document
      method: POST
      path: /api/vendor-credits/{vendorCredit}/attachments
      summary: Upload the credit memo as multipart/form-data (field "file"; PDF, PNG, JPG, WEBP up to 20 MB).
      parameters:
        - name: vendorCredit
          in: path
          type: integer
          required: true
          description: Vendor credit id.
        - name: file
          in: body
          type: string
          required: true
          description: The memo file (multipart form field).

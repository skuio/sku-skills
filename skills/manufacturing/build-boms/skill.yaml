name: build-boms
title: Build Bills of Materials from a Recipe Sheet
domain: manufacturing
version: 1.0.0
description: >-
  Create bills of materials (BOMs, recipes) for manufactured products from the user's recipe
  sheet, after approval. Use for the Launch Roadmap's "Bills of materials" step, when onboarding a
  manufacturer, or when a manufactured product has no recipe. Never edits or deletes an existing
  BOM.
tagline: Create BOMs for manufactured products from the user's recipe sheet
tags: [manufacturing, bom, recipes, bill-of-materials, components, onboarding, launch-roadmap]
maintainers: [kmizzi]
composes: [find-product, build-product-catalog]
pages:
  - /manufacturing/boms
icon: mdi-factory
auth:
  scopes: [products:read, manufacturing:read, manufacturing:write]
api:
  base_url: https://{tenant}.sku.io
  operations:
    - id: list-products
      method: GET
      path: /api/v2/products
      summary: >-
        List or search products. With filter[type]=manufactured it returns the population the
        Launch Roadmap checks (skip rows with a non-null archived_at). With filter[search] it finds
        an ingredient the sheet names instead of giving its SKU. BOM lines accept only products
        that carry stock (standard, kit, blemished, manufactured).
      parameters:
        - name: filter[type]
          in: query
          type: string
          required: false
          description: Comma-separated product types, e.g. manufactured, or standard,manufactured.
          example: manufactured
        - name: filter[search]
          in: query
          type: string
          required: false
          description: Free-text search across SKU, name, barcode, MPN and brand.
        - name: per_page
          in: query
          type: integer
          required: false
          description: Page size (default 10). Iterate page until last_page.
          example: 100
        - name: page
          in: query
          type: integer
          required: false
          description: Page number.
    - id: list-boms
      method: GET
      path: /api/manufacturing/boms
      summary: >-
        List BOMs with product_id, status, version_number, component_lines_count and archived_at.
        Archived BOMs are excluded unless filter[archived]=all.
      parameters:
        - name: filter[product_id]
          in: query
          type: integer
          required: false
          description: Only BOMs for this product.
        - name: filter[search]
          in: query
          type: string
          required: false
          description: Matches BOM id, BOM name, or the product's name or SKU.
        - name: per_page
          in: query
          type: integer
          required: false
          description: Page size (default 10).
          example: 100
        - name: page
          in: query
          type: integer
          required: false
          description: Page number.
    - id: find-product-by-sku
      method: GET
      path: /api/products/by-sku
      summary: Resolve an ingredient or part SKU from the recipe sheet to its product id and type.
      parameters:
        - name: sku
          in: query
          type: string
          required: true
          description: The exact SKU.
          example: RAW-FLOUR-25KG
    - id: list-units-of-measure
      method: GET
      path: /api/manufacturing/units-of-measure
      summary: >-
        The account's units of measure (id, name, code, type). Use to map the sheet's units ("kg",
        "ea", "ml") to uom ids.
      parameters:
        - name: uom_type
          in: query
          type: string
          required: false
          description: Optional filter by unit type, e.g. weight.
          example: weight
    - id: get-product-units
      method: GET
      path: /api/manufacturing/products/{product}/units-of-measure
      summary: >-
        The units of measure enabled for one product (its stock unit plus alternates). A BOM line's
        uom_id must be one of these.
      parameters:
        - name: product
          in: path
          type: integer
          required: true
          description: The product id.
    - id: create-bom
      method: POST
      path: /api/manufacturing/boms
      summary: >-
        Create one BOM with its component lines. product_id, name and effective_from are required;
        the primary output line (product_id x 1) is added for you when output_lines is omitted.
        Returns the BOM with its id and lines.
      parameters:
        - name: product_id
          in: body
          type: integer
          required: true
          description: The manufactured product this recipe makes.
          example: 900
        - name: name
          in: body
          type: string
          required: true
          description: BOM name, up to 255 characters.
          example: "Sourdough Loaf 800g — recipe v1"
        - name: effective_from
          in: body
          type: string
          required: true
          description: Date the recipe applies from (Y-m-d).
          example: "2026-10-21"
        - name: status
          in: body
          type: string
          required: false
          description: >-
            BomStatus: draft, active or archived. Send draft; a person activates it after review.
            Over the MCP server leave it out (sending it is refused; MCP BOMs are always drafts).
          example: draft
        - name: version_notes
          in: body
          type: string
          required: false
          description: Free text — record the source sheet and row here.
        - name: expected_yield_percent
          in: body
          type: number
          required: false
          description: 0–100. Only when the sheet states a yield.
        - name: default_consumption_method
          in: body
          type: string
          required: false
          description: forward_flush or backflush. Omit unless the user says how they issue materials.
        - name: output_lines
          in: body
          type: array
          required: false
          description: >-
            Omit for a single finished product. Each { product_id, role (primary, coproduct,
            byproduct, scrap), quantity, uom_id }. Use it when one batch yields more than one unit
            (product_id, role primary, quantity 12) so component quantities are per batch.
        - name: component_lines
          in: body
          type: array
          required: false
          description: >-
            The recipe. Each { product_id (required), quantity (required, >= 0), uom_id (optional
            — defaults to the product's stock unit; must be enabled on the product),
            expected_scrap_percent (0–100), consumption_method, is_optional, notes, sort_order }.
            The roadmap counts a BOM only when it has at least one component line.
    - id: get-bom
      method: GET
      path: /api/manufacturing/boms/{bom}
      summary: Fetch one BOM with its component and output lines, to verify after creating it.
      parameters:
        - name: bom
          in: path
          type: integer
          required: true
          description: The BOM id.

# How the SKU.io MCP server exposes this skill (dist/mcp/manifest.json). See SKILL_SPEC.md.
mcp:
  prompt_only: true

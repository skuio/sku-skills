name: connect-to-sku
title: Connect to SKU.io
domain: platform
version: 1.1.0
description: >-
  The entry point for any SKU.io task. Establish an authenticated connection: point at the
  correct tenant base URL, send a Personal Access Token as a Bearer token, and prove it works with
  GET /api/me — the scope-free identity call whose tenant_id confirms you are on the account the
  user meant and whose token.scopes tell you what the token may do, so you can check for a missing
  scope up front instead of hitting a 403 mid-operation. Use this first whenever you are about to
  call the SKU.io API.
tagline: Authenticate, verify the token and tenant, and establish scopes before anything else
tags: [auth, setup, getting-started, personal-access-token]
maintainers: [kmizzi]
pages:
  - /settings/developer/personal-access-tokens
auth:
  scopes: [settings:read, warehouses:read]
api:
  base_url: https://{tenant}.sku.io
  operations:
    - id: verify-connection
      method: GET
      path: /api/me
      summary: >-
        Lightweight "who am I" check and the correct way to verify a connection. Requires NO scopes,
        so it works with any token; a 200 can only come from the correct host; and it returns
        tenant_id / tenant_name, which is how you confirm you are on the account the user meant.
        It also echoes back the presented token as a "token" block — id, name, type, scopes,
        expires_at, is_expired — so read token.scopes to confirm the token can do the job before
        starting. Session callers get "token": null; an absent key means a build predating token
        introspection. Do NOT use /api/auth/profile — /api/auth/* is session-only and answers every
        PAT with 403 "This endpoint is not available to API tokens."
    - id: list-scopes
      method: GET
      path: /api/developer/scopes
      summary: >-
        The catalogue of every scope and what each one permits, grouped by resource. Static
        reference data, so it requires no scopes and a PAT may read it — useful for naming
        precisely which scope a token is missing. Its sibling
        /api/developer/personal-access-tokens stays session-only: a token may describe itself,
        but it cannot enumerate other tokens or mint new ones.
    - id: list-warehouses
      method: GET
      path: /api/v2/warehouses
      summary: >-
        List warehouses (needs warehouses:read). Real warehouse names are the practical way to
        confirm you are on the account the user meant, which no settings or identity call can tell
        you. Worth a per_page=5 call before any write.

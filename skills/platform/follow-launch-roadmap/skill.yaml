name: follow-launch-roadmap
title: Follow the Launch Roadmap
domain: platform
version: 1.0.0
description: >-
  Work through an account's SKU.io Launch Roadmap with the user: pick the next unblocked steps,
  explain each, hand off to the matching skill to do it, and record progress. Use for "what's next
  on our launch?", "help me with my onboarding steps", or when the user names a roadmap step.
tagline: Pick your next Launch Roadmap steps and work them with the matching skill
tags: [platform, onboarding, launch-roadmap, implementation, go-live, getting-started, coaching]
maintainers: [kmizzi]
composes:
  - build-product-catalog
  - configure-bundles
  - build-boms
  - map-supplier-costs
  - set-initial-inventory
  - create-purchase-order
  - create-saved-view
  - map-gl-accounts
  - sync-sops
pages:
  - /getting-started
icon: mdi-rocket-launch-outline
auth:
  scopes: [launch_plan:read, launch_plan:write]
api:
  base_url: https://{tenant}.sku.io
  operations:
    - id: get-launch-plan-summary
      method: GET
      path: /api/launch-plan/summary
      summary: >-
        Cheap check (cached five minutes): { exists, roadmap_available, health, reason,
        target_launch_on, forecast_launch_on, open_for_me }. open_for_me counts the viewer's open
        steps.
    - id: get-launch-plan
      method: GET
      path: /api/launch-plan
      summary: >-
        The whole roadmap: status, health, target and forecast launch dates, waiting_on,
        critical_path, next_steps_for_me and next_steps (step keys), blocked_summary, mcp {url,
        skills_url}, milestones, and steps[] (id, key, title, completion, manual_allowed, state,
        progress, evidence, done_when, skill, owner, default_owner_role, size, due_on, health,
        health_reason, blocked_by, blocked, lanes {manual, import, ai}, locked, signed_off,
        not_applicable, comment_count). With no plan it still returns 200 with data null and
        exists false.
    - id: get-step-events
      method: GET
      path: /api/launch-plan/steps/{step}/events
      summary: >-
        A step's comments and activity, newest first: { id, kind, user, body, data, created_at }.
        Read it before starting so you know what teammates already tried.
      parameters:
        - name: step
          in: path
          type: integer
          required: true
          description: The step id (steps[].id, not its key).
    - id: comment-on-step
      method: POST
      path: /api/launch-plan/steps/{step}/comments
      summary: >-
        Post a comment on a step — the progress note after a work session, or what is blocking it.
        Returns the created event (201). Needs the launch_plan.manage permission.
      parameters:
        - name: step
          in: path
          type: integer
          required: true
          description: The step id.
        - name: body
          in: body
          type: string
          required: true
          description: The comment, up to 5000 characters.
          example: "AI session 2026-10-21: configured 31 of 43 bundles from the Kits tab of Catalog.xlsx; 12 held out (components not in the catalog, list below)."
    - id: block-step
      method: POST
      path: /api/launch-plan/steps/{step}/block
      summary: >-
        Mark an open step blocked, with why and who it waits on. Returns the updated plan.
        Refused (422) on a done step or one marked not needed. Clearing the mark is a person's job
        in the app.
      parameters:
        - name: step
          in: path
          type: integer
          required: true
          description: The step id.
        - name: reason
          in: body
          type: string
          required: true
          description: What is missing, up to 300 characters.
          example: "Waiting on the bookkeeper to approve the GL mapping table sent 2026-10-21."
        - name: "on"
          in: body
          type: string
          required: true
          description: Who it waits on — sku, customer or third_party.
          example: customer
    - id: tick-manual-step
      method: PATCH
      path: /api/launch-plan/steps/{step}
      summary: >-
        Tick a manual step (manual_allowed true) once the user confirms it. Send manual_state and
        nothing else. Returns the updated plan; a step that completes from data or a sign-off
        returns 422.
      parameters:
        - name: step
          in: path
          type: integer
          required: true
          description: The step id.
        - name: manual_state
          in: body
          type: string
          required: true
          description: not_started, in_progress or done.
          example: done
    - id: refresh-launch-plan
      method: POST
      path: /api/launch-plan/refresh
      summary: >-
        Re-run the roadmap's data checks now instead of waiting for the next scheduled run, and
        return the updated plan. At most once a minute (otherwise 429 with Retry-After). A
        paused or archived plan is not re-evaluated. Personal Access Token only; the MCP server
        refuses it.

# How the SKU.io MCP server exposes this skill (dist/mcp/manifest.json). See SKILL_SPEC.md.
mcp:
  prompt_only: true

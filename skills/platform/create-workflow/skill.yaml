name: create-workflow
title: Create a Workflow (automation)
domain: platform
version: 1.2.0
description: >-
  Build, validate, publish, test-run and maintain SKU.io automation workflows from the API — the
  same node/edge graph the visual Workflow Builder draws. Use this whenever a user wants something
  to happen automatically in response to something else: email or Slack me when an order lands on
  a given sales channel, tag or note orders that match a rule, post a webhook to another system,
  import a supplier feed from FTP on a schedule, or route orders to a warehouse — and when an
  existing workflow needs changing, pausing, or diagnosing because it did not fire. Starts from a
  template when one fits, discovers the node catalog and credentials live, and publishes only
  after a dry run the user has seen — including picking the right moment to fire on, which for an
  order alert is the channel import rather than the sales-order creation.
tagline: Build, validate, publish and test an automation workflow from a node/edge graph
tags: [automation, workflow, workflow-builder, triggers, notifications, no-code, integrations]
maintainers: [kmizzi]
pages:
  - /automation/workflows
auth:
  scopes: [settings:read, settings:write]
api:
  base_url: https://{tenant}.sku.io
  operations:
    - id: list-node-types
      method: GET
      path: /api/automation/workflow-nodes
      summary: >-
        The live catalog of every node type — its category, description, settings (key, type,
        required, default, apiEndpoint, credentialTypes), outputs (the branch handles) and
        outputSchema; on newer builds also `preview`/`mutates`, condition `operators`, and a
        trigger's `availability` on this account. Always read this first; it is the only
        reliable source for valid `nodes[*].type` values and their `data` keys.
    - id: get-sample-payload
      method: POST
      path: /api/automation/workflow-nodes/sample-payload
      summary: >-
        A trigger payload built from the most recent real record that matches the trigger's
        settings — the right `trigger_payload` for a dry run. Returns `data: null` when nothing
        on the account matches yet.
      parameters:
        - name: node_type
          in: body
          type: string
          required: true
          description: The trigger's `type` from the node catalog.
          example: channel-order-imported
        - name: parameters
          in: body
          type: object
          required: false
          description: The trigger node's `data`, so the sample respects its filters.
          example: {salesChannels: [30]}
    - id: lookup-sales-channels
      method: GET
      path: /api/automation/lookups/sales-channels
      summary: Sales channels as {id, name}. The stored value is the numeric id.
    - id: lookup-integrations
      method: GET
      path: /api/automation/lookups/integrations
      summary: >-
        Connected integrations as {id, name}, where `id` IS the name (e.g. `Shopify`) — the
        integration order filter matches on the name as text.
    - id: lookup-sub-sales-channels
      method: GET
      path: /api/automation/lookups/sub-sales-channels
      summary: >-
        Sub sales channels as {id, name}, where `id` is the sub-channel name (e.g. `POS`) and
        `name` also names its parent channel(s).
    - id: lookup-warehouses
      method: GET
      path: /api/automation/lookups/warehouses
      summary: Warehouses as {id, name}, for warehouse-valued node settings.
    - id: lookup-tags
      method: GET
      path: /api/automation/lookups/tags
      summary: Order tags, for the Apply Tags node's `tags` setting.
    - id: lookup-airtable-instances
      method: GET
      path: /api/automation/lookups/airtable-instances
      summary: Connected Airtable instances, for the Airtable node.
    - id: lookup-order-filter-fields
      method: GET
      path: /api/automation/lookups/order-filter-fields
      summary: >-
        The sales-order fields an order filter may test. The filter is evaluated against this
        allow-list, so a field not in it never matches.
    - id: lookup-credentials
      method: GET
      path: /api/automation/workflow-credentials/lookup
      summary: >-
        Stored credentials as {uuid, name}, filtered by type — the values for a
        `credential_select` setting's `credentialUuid`.
      parameters:
        - name: type
          in: query
          type: string
          required: true
          description: One type or a comma-separated list, from the setting's `credentialTypes`.
          example: ftp,sftp
    - id: create-credential
      method: POST
      path: /api/automation/workflow-credentials
      summary: >-
        Store a credential (secrets encrypted at rest, redacted on read). Only with values the
        user supplied for this purpose; `google_oauth` cannot be created here — it needs the
        browser consent flow in the Workflow Builder.
      parameters:
        - name: name
          in: body
          type: string
          required: true
          description: Display name, max 128 chars.
          example: Supplier SFTP
        - name: type
          in: body
          type: string
          required: true
          description: basic_auth | api_key | bearer_token | ftp | sftp | webhook_token.
          example: sftp
        - name: data
          in: body
          type: object
          required: true
          description: The type's fields — for ftp/sftp `host`, `port`, `username`, `password` or `privateKey` (+ `passphrase`), `root`.
    - id: list-templates
      method: GET
      path: /api/automation/workflow-templates
      summary: >-
        Ready-made workflows with their `parameterPrompts` (what must be filled in) and
        `requiredCredentials`. Check here before assembling a graph by hand.
    - id: get-template
      method: GET
      path: /api/automation/workflow-templates/{slug}
      summary: One template with its prompts and required credentials.
      parameters:
        - name: slug
          in: path
          type: string
          required: true
          description: The template slug.
          example: import-products-ftp-hourly
    - id: instantiate-template
      method: POST
      path: /api/automation/workflow-templates/{slug}/instantiate
      summary: >-
        Create a Draft workflow from a template, writing each answered prompt into the graph.
        A prompt you leave out keeps the template's placeholder, so answer every required one.
      parameters:
        - name: slug
          in: path
          type: string
          required: true
          description: The template slug.
        - name: name
          in: body
          type: string
          required: false
          description: Workflow name; defaults to the template's.
        - name: parameters
          in: body
          type: object
          required: false
          description: Answers keyed by each prompt's `key`, typed as the prompt says.
          example: {fbaWarehouseId: 3, threePlWarehouseId: 7}
    - id: list-workflows
      method: GET
      path: /api/automation/workflows
      summary: >-
        Paginated list of workflows with run stats. Use it to avoid creating a duplicate, and to
        find an existing workflow to update.
      parameters:
        - name: filter[status]
          in: query
          type: string
          required: false
          description: draft | published | disabled.
          example: published
        - name: filter[trigger_type]
          in: query
          type: string
          required: false
          description: event | schedule | manual | webhook | pre_dispatch.
          example: event
        - name: filter[search]
          in: query
          type: string
          required: false
          description: Matches name or description.
    - id: validate-workflow
      method: POST
      path: /api/automation/workflows/validate
      summary: >-
        Check a graph without saving. Verifies exactly one trigger node, that every edge
        references existing nodes, and that every non-trigger node has an incoming connection.
        Call this before create and before update — it is free and catches the structural
        mistakes.
      parameters:
        - name: nodes
          in: body
          type: array
          required: true
          description: The node list, same shape as on create.
        - name: edges
          in: body
          type: array
          required: true
          description: The edge list, same shape as on create.
    - id: create-workflow
      method: POST
      path: /api/automation/workflows
      summary: >-
        Create a workflow in Draft status from a node/edge graph. The trigger type is derived
        from the trigger node — you do not set it. Drafts never fire.
      parameters:
        - name: name
          in: body
          type: string
          required: true
          description: Display name, max 128 chars.
          example: 'TikTok Shop: email on new order'
        - name: description
          in: body
          type: string
          required: false
          description: >-
            What it does and why it exists. Worth writing — it is what the next person reads
            before deciding whether to disable it.
        - name: category
          in: body
          type: string
          required: false
          description: Free-text grouping, max 50 chars (e.g. orders, imports, inventory).
          example: orders
        - name: nodes
          in: body
          type: array
          required: true
          description: >-
            One object per node: `id` (string, max 64, unique in the graph), `type` (a `type`
            from the node catalog), `position` {x, y} (numeric — the canvas coordinates the
            builder will draw it at), `data` (object — the node's settings, keyed by the
            `settings[*].key` the catalog lists; required even when empty), optional `label`.
          example:
            - id: trigger-1
              type: sales-order-created
              position: {x: 80, y: 200}
              data: {salesChannels: [30], orderStatuses: ['*']}
              label: Order created
        - name: edges
          in: body
          type: array
          required: true
          description: >-
            One object per connection: `id`, `source` (node id), `target` (node id); optional
            `sourceHandle` (required to leave a branching node — `true`/`false` on IF,
            `case0…`/`fallback` on Switch), `targetHandle`, `label`, `branchLabel`.
          example:
            - id: e1
              source: trigger-1
              target: node-2
        - name: viewport
          in: body
          type: object
          required: false
          description: Canvas position {x, y, zoom} the builder opens at. Defaults are fine.
        - name: preview_mode
          in: body
          type: boolean
          required: false
          description: >-
            When true, every run executes triggers, conditions and lookups for real but SKIPS
            every state-changing Action/Integration step (emails, Slack, webhooks, order and
            inventory writes), recording what each would have done. Default false.
          example: true
    - id: get-workflow
      method: GET
      path: /api/automation/workflows/{workflow}
      summary: One workflow with its full graph, derived triggerType/triggerConfig, and publish state.
      parameters:
        - name: workflow
          in: path
          type: integer
          required: true
          description: The workflow id.
    - id: update-workflow
      method: PUT
      path: /api/automation/workflows/{workflow}
      summary: >-
        Update name, description, category, graph, settings or preview_mode. All fields
        optional. Submitting `nodes` re-derives the trigger type and trigger config, so send the
        WHOLE graph — a partial node list silently drops the nodes you left out.
      parameters:
        - name: workflow
          in: path
          type: integer
          required: true
          description: The workflow id.
        - name: nodes
          in: body
          type: array
          required: false
          description: The complete node list. Omit the key entirely to leave the graph untouched.
        - name: edges
          in: body
          type: array
          required: false
          description: The complete edge list.
        - name: preview_mode
          in: body
          type: boolean
          required: false
          description: Toggle preview (dry-run) mode on an existing workflow.
    - id: publish-workflow
      method: POST
      path: /api/automation/workflows/{workflow}/publish
      summary: >-
        Validate then publish, making the trigger live. On validation failure nothing changes
        and the errors come back as 422. On success the version increments and publishedAt is
        set. A workflow only ever fires once published.
      parameters:
        - name: workflow
          in: path
          type: integer
          required: true
          description: The workflow id.
    - id: toggle-workflow
      method: POST
      path: /api/automation/workflows/{workflow}/toggle
      summary: >-
        Flip between published (live) and disabled (paused). Only those two states can be
        toggled — a draft must be published first. This is the off switch; prefer it to delete.
      parameters:
        - name: workflow
          in: path
          type: integer
          required: true
          description: The workflow id.
    - id: execute-workflow
      method: POST
      path: /api/automation/workflows/{workflow}/execute
      summary: >-
        Run a published workflow by hand against a payload you supply, instead of waiting for a
        real trigger. Queued asynchronously — the response is the execution record at status
        `pending`; poll get-execution for the result.
      parameters:
        - name: workflow
          in: path
          type: integer
          required: true
          description: The workflow id.
        - name: trigger_payload
          in: body
          type: object
          required: false
          description: >-
            The data the trigger node would have emitted, shaped like that trigger's
            `outputSchema`. Omit it and event triggers fall back to sample data built from the
            most recent matching record.
    - id: list-executions
      method: GET
      path: /api/automation/workflows/{workflow}/executions
      summary: Run history for one workflow — status, duration, trigger reference, error.
      parameters:
        - name: workflow
          in: path
          type: integer
          required: true
          description: The workflow id.
    - id: get-execution
      method: GET
      path: /api/automation/workflow-executions/{execution}
      summary: >-
        One execution with its per-step results — each step's status, logs, and (in preview
        mode) the input the skipped step would have used. This is where you read what actually
        happened.
      parameters:
        - name: execution
          in: path
          type: integer
          required: true
          description: The execution id.
    - id: clone-workflow
      method: POST
      path: /api/automation/workflows/{workflow}/clone
      summary: >-
        Duplicate a workflow as a new Draft named "<name> (Copy)". Use it to change a live
        workflow safely — clone, edit the clone, test it, then swap.
      parameters:
        - name: workflow
          in: path
          type: integer
          required: true
          description: The workflow id.
    - id: delete-workflow
      method: DELETE
      path: /api/automation/workflows/{workflow}
      summary: >-
        Permanently delete a workflow. Irreversible, and it takes the run history with it —
        disable instead unless the user explicitly asked to delete.
      parameters:
        - name: workflow
          in: path
          type: integer
          required: true
          description: The workflow id.

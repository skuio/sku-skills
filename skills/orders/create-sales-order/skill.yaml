name: create-sales-order
title: Create a Sales Order
domain: orders
version: 1.2.0
description: >-
  Create a sales order in SKU.io with one or more line items: status, date, currency, optional
  customer and store, and the SKUs, quantities and prices sold. Use to place an order for a
  customer. Resolve products first with find-product.
tagline: Create a sales order with line items
tags: [orders, sales-order, create, checkout, fulfilment]
maintainers: [kmizzi]
composes: [find-product]
pages:
  - /orders/sales-orders
icon: mdi-cart-plus
auth:
  scopes: [orders:read, orders:write, products:read, settings:read]
api:
  base_url: https://{tenant}.sku.io
  operations:
    - id: list-currencies
      method: GET
      path: /api/currencies
      summary: >-
        List the account's enabled currencies (id, code, conversion rate, is_default) to resolve or
        verify currency_code / currency_id.
    - id: create-sales-order
      method: POST
      path: /api/sales-orders
      summary: Create a sales order with header fields and an array of line items.
      parameters:
        - name: order_status
          in: body
          type: string
          required: true
          description: >-
            Order status — one of draft, reserved, open, closed. Use "draft" for an unconfirmed
            order (lines optional); any other status requires at least one line. "closed" also
            requires fulfilled_at.
          example: draft
        - name: order_date
          in: body
          type: string
          required: true
          description: >-
            Order date (ISO-8601). The API rejects the request without it; send today's date for a
            new order.
          example: "2026-07-09"
        - name: currency_code
          in: body
          type: string
          required: true
          description: >-
            ISO currency code for the order (e.g. "USD", "CAD"). Required unless you pass
            currency_id; must be one of the account's enabled currencies — resolve or verify it
            with list-currencies (use the is_default one unless the order is in another currency).
          example: USD
        - name: currency_id
          in: body
          type: integer
          required: false
          description: Currency id, as an alternative to currency_code.
        - name: customer_id
          in: body
          type: integer
          required: false
          description: Existing customer id to attach the order to.
        - name: store_id
          in: body
          type: integer
          required: false
          description: Store/sales-channel id the order belongs to.
        - name: customer_po_number
          in: body
          type: string
          required: false
          description: The customer's purchase-order reference.
        - name: sales_order_lines
          in: body
          type: array
          required: false
          description: >-
            Array of line items. Required unless order_status is "draft". Each line:
            { description (required), quantity (required), amount (required unit price),
            product_id or sku (to link a catalog product), warehouse_id (optional) }. A line with
            quantity 0 also needs canceled_quantity.

# How the SKU.io MCP server exposes this skill (dist/mcp/manifest.json). See SKILL_SPEC.md.
mcp:
  tools:
    - tool: create_sales_order
      operation: create-sales-order
      title: Create a sales order
      description: >-
        Creates a sales order, as a draft or with line items. Returns the order id, number, status
        and sku_url.
      scope: orders:write
      params:
        order_date: ISO date.
        currency_id: ""
        customer_id: ""
        store_id: ""
        customer_po_number: ""
        order_status: draft, reserved, open or closed. A draft needs no lines; closed also needs fulfilled_at.
        currency_code: ISO currency code enabled on the account, e.g. USD.
        sales_order_lines: "Lines: [{description, quantity, amount (unit price), product_id or sku, warehouse_id}]."
      annotations: { read_only: false, destructive: true, idempotent: false, open_world: false }

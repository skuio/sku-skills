name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      # The README's install is `git clone` + `node tools/install.mjs`: prove it needs no `npm ci`.
      - name: Installer runs on a fresh clone with plain Node
        run: |
          node tools/install.mjs --list > /dev/null
          node tools/install.mjs all --project "$RUNNER_TEMP/install-check" --agent claude,codex,cursor
      - run: npm ci
      - name: Validate skills
        run: npm run validate
      - name: Scan for secrets & tenant data
        run: npm run scan
        env:
          # Newline/comma-separated denylist of real tenant slugs, server IPs, and SSH aliases.
          # Stored as a repo secret so the denylist itself never appears in the public tree.
          # Absent on fork PRs — the always-on pattern rules still run there.
          SECRET_DENYLIST: ${{ secrets.SECRET_DENYLIST }}
      - name: Build all targets
        run: npm run build
      - name: Verify committed dist/, plugin manifest and README tables are up to date
        run: |
          if ! git diff --quiet -- dist README.md .claude-plugin; then
            echo "::error::dist/, .claude-plugin/ or a generated README table is stale — run 'npm run build' and commit the refreshed files."
            git --no-pager diff --stat -- dist README.md .claude-plugin
            exit 1
          fi
      # The README's first line is `npx skills add skuio/sku-skills`. Run that installer on this
      # checkout, so a change that hides a skill from it fails here and not on someone's machine.
      # The installer needs Node 22.20+; everything above stays on 20, and tools/install.mjs on 18+.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: npx skills installs every skill for Claude Code, Codex and Cursor
        run: npm run check:install
